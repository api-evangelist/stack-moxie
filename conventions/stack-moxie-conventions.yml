  lifecycle: lifecycle/stack-moxie-lifecycle.yml
  rate_limits: rate-limits/stack-moxie-rate-limits.yml
  data_model: data-model/stack-moxie-data-model.yml
  plans: plans/stack-moxie-plans-pricing.yml
