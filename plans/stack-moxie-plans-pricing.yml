note: >-
  Stack Moxie publishes a full public price list for the product itself. There is
  no separate API plan and no per-call API pricing: the REST API at
  https://app.stackmoxie.com/api/ is included with the account and is metered by
  the same unit as the UI - a "Run" (one activity executed in Stack Moxie: a test,
  a list import, or a spreadsheet trigger). Calling POST .../scenarios/{id}/runs or
  POST .../asyncScenario therefore draws down the plan quota below. The pricing
  page does not say which tier grants API access, nor whether API-initiated runs
  are metered differently - a real gap for anyone budgeting an integration. The
  open-source Crank CLI and its Cogs are free and unmetered and are not covered by
  these plans.
