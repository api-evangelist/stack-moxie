note: >-
  Stack Moxie publishes no client SDK for a hosted REST API, because it exposes no
  public API. Its first-party developer distribution is the open-source Crank
  ecosystem: the `crank` CLI (oclif, distributed as a signed tarball via an install
  script, NOT via npm - the npm name `crank` belongs to an unrelated Yahoo package),
  the `@run-crank/utilities` npm library used to implement Cogs against the
  published Cog gRPC contract in grpc/stack-moxie-cog.proto, a VS Code authoring
  extension, and 19 public Docker images under the `automatoninc` Docker Hub
  namespace that ARE the Cogs.
currency_finding: >-
  Every first-party artifact is materially stale relative to its own source. The
  CLI's last tagged release is v0.11.1 (2020-06-23) though the repo saw commits to
  2023; the VS Code extension last shipped 2020-03-28; the npm utilities library
  last shipped 2022-12-30; and every Docker `latest` Cog tag was last pushed in
  2019-2020, with 7 of the 19 images carrying no `latest` tag at all - only rolling
  `dev-*` builds. Meanwhile the GitHub source repos for cog-marketo, cog-web,
  cog-inbox-mailgun and cog-sfmc were pushed as recently as 2025. A consumer
  installing a Cog today therefore pulls a 2020 image, or an unpinned `dev-*` tag
  whose contents cannot be identified from the tag name.
