aid: stack-moxie
name: Stack Moxie
description: >-
  Stack Moxie is a revenue-observability platform that provides continuous
  testing and monitoring for AI, marketing, and RevOps technology stacks. It
  watches integrated SaaS platforms end-to-end, catches outages, broken
  automations, and email-deliverability issues before they become revenue
  incidents, and QAs campaign launches so teams ship error-free. Stack Moxie
  exposes no public REST API; its developer surface is the open-source Crank
  CLI - a no-code BDD test runner - and its ecosystem of gRPC "Cog" plugins for
  Salesforce, Marketo, Pardot, Eloqua, OpenAI, web, inbox, and more.
