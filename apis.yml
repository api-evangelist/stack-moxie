apis:
- name: Stack Moxie REST API
  description: >-
    The hosted Stack Moxie REST API. Create, read, update and delete test
    Scenarios; run them synchronously or asynchronously and read their outcomes
    and logs; schedule recurring runs; manage Connections (stored credentials for
    Salesforce, Marketo, Pardot, Eloqua, Dynamics and HubSpot via Cogs); read the
    Cog registry; and administer Organizations, members and notification groups.
    OpenAPI 3.0.1, 25 paths, 43 operations, 17 schemas. All operations are
    authenticated with an account-issued JWT bearer token and scoped to an
    Organization UUID in the path.
  humanURL: https://api.stackmoxie.com/
  baseURL: https://app.stackmoxie.com/api/
