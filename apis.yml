aid: stack-moxie
name: Stack Moxie
description: >-
  Stack Moxie is a revenue-observability platform that provides continuous
  testing and monitoring for AI, marketing, and RevOps technology stacks. It
  watches integrated SaaS platforms end-to-end, catches outages, broken
  automations, and email-deliverability issues before they become revenue
  incidents, and QAs campaign launches so teams ship error-free. It ships two
  developer surfaces: a hosted REST API (OpenAPI 3.0.1, 43 operations, JWT bearer
  auth, base https://app.stackmoxie.com/api/) for creating, running, scheduling
  and monitoring test Scenarios programmatically; and the open-source Crank CLI -
  a no-code BDD test runner - with its ecosystem of gRPC "Cog" plugins for
  Salesforce, Marketo, Pardot, Eloqua, HubSpot, Dynamics, OpenAI, web, inbox,
  DNS and more.
